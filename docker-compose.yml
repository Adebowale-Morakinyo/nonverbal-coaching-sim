services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nonverbal_coaching
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nonverbal_coaching"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: golang:1.22-alpine
    working_dir: /app
    command: go run ./cmd/server
    env_file:
      - .env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nonverbal_coaching?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
