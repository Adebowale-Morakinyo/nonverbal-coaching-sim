services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nonverbal_sim
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nonverbal_sim"]
      interval: 5s
      timeout: 5s
      retries: 5

